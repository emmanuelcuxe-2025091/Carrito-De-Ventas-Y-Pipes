<h2>Carrito de compras</h2>

<div *ngIf="(carrito$ | async)?.length === 0">
  <p>El carrito está vacío.</p>
</div>

<table *ngIf="(carrito$ | async)?.length! > 0">
  <thead>
    <tr>
      <th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of (carrito$ | async)">
      <td>{{ item.nombre }}</td>
      <td>{{ item.precio | currency:'GTQ' }}</td>
      <td>
        <input type="number" [value]="item.cantidad" min="1"
               (change)="onCambiarCantidad(item.id, $event)" />
      </td>
      <td>{{ item.precio | subtotal:item.cantidad | currency:'GTQ' }}</td>
      <td><button (click)="onEliminar(item.id)">Eliminar</button></td>
    </tr>
  </tbody>
</table>

<h3>Total: {{ total$ | async | currency:'GTQ' }}</h3>
